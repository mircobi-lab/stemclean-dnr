[package]
name = "stemclean-app"
description = "StemClean DNR per Mac (Tauri 2): la pagina con il motore Rust in una finestra nativa"
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Mirco Baiocco — MBStudio91"]

[[bin]]
name = "stemclean-dnr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
